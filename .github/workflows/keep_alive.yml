name: Render Keep-Alive

on:
  schedule:
    # Ping every 10 minutes to prevent Render free-tier 15-minute idle spin-down
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake and verify Recon health endpoint
        run: |
          curl -fsS --max-time 60 https://recon-ssld.onrender.com/api/health
