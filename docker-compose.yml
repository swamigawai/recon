# Recon — Docker Compose Deployment Specification
version: "3.8"

services:
  recon-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recon-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - RECON_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
