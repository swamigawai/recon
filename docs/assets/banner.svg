<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Recon Banner">
  <title>Recon — The Integration Readiness Engine</title>
  <defs>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="1" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#ambientGlow)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Accent Top Border -->
  <rect width="1200" height="3" fill="url(#bannerGrad)" />

  <!-- Center Content Container -->
  <g transform="translate(100, 70)">
    <!-- Brand Mark -->
    <g transform="translate(0, 0)">
      <rect width="72" height="72" rx="18" fill="#111827" stroke="#334155" stroke-width="2" />
      <path d="M 18 36 L 31.5 22.5 L 45 36 L 31.5 49.5 Z" fill="none" stroke="url(#bannerGrad)" stroke-width="4.5" stroke-linejoin="round" />
      <line x1="45" y1="36" x2="57" y2="36" stroke="#10B981" stroke-width="4.5" stroke-linecap="round" />
      <circle cx="18" cy="36" r="4.5" fill="#6366F1" />
      <circle cx="31.5" cy="22.5" r="4" fill="#818CF8" />
      <circle cx="31.5" cy="49.5" r="4" fill="#06B6D4" />
      <circle cx="45" cy="36" r="4.8" fill="#10B981" />
      <circle cx="57" cy="36" r="3.6" fill="#34D399" />
    </g>

    <!-- Header Titles -->
    <text x="96" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#F8FAFC" letter-spacing="2">RECON</text>
    <text x="96" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#94A3B8" letter-spacing="3">THE INTEGRATION READINESS ENGINE</text>

    <!-- Tagline -->
    <text x="0" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#E2E8F0">
      “Know what will break before you build the integration.”
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="185" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">
      A developer-first preflight engine that detects mapping gaps, contract mismatches, and data-quality failures
    </text>
    <text x="0" y="210" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">
      in third-party partner data batches before you write or deploy ingestion pipeline code.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 240)">
      <!-- Pill 1: Preflight Gate -->
      <rect x="0" y="0" width="180" height="34" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="90" y="21" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#A5B4FC" text-anchor="middle">PREFLIGHT CLI GATE</text>

      <!-- Pill 2: Zero Data Loss -->
      <rect x="195" y="0" width="220" height="34" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="305" y="21" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#6EE7B7" text-anchor="middle">ZERO-LOSS QUARANTINE</text>

      <!-- Pill 3: Pure Python AST -->
      <rect x="430" y="0" width="200" height="34" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="530" y="21" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#67E8F9" text-anchor="middle">PYTHON AST ADAPTERS</text>

      <!-- Pill 4: Local Privacy -->
      <rect x="645" y="0" width="180" height="34" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="735" y="21" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#CBD5E1" text-anchor="middle">100% LOCAL EXECUTION</text>
    </g>
  </g>
</svg>