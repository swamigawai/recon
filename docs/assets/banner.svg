<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Recon — The Integration Readiness Engine">
  <title>Recon — The Integration Readiness Engine</title>
  
  <defs>
    <!-- Matte graphite canvas with subtle vignette -->
    <linearGradient id="canvasMatte" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1118" />
      <stop offset="50%" stop-color="#090B10" />
      <stop offset="100%" stop-color="#050609" />
    </linearGradient>

    <!-- Titanium letterform sheen -->
    <linearGradient id="metalSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Subtle focal ambient glow -->
    <radialGradient id="focalGlow" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#090B10" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Matte Canvas -->
  <rect width="1200" height="340" fill="url(#canvasMatte)" />
  <rect width="1200" height="340" fill="url(#focalGlow)" />

  <!-- Outer Framing Hairline (1px) -->
  <rect x="0.5" y="0.5" width="1199" height="339" fill="none" stroke="#1A202C" stroke-width="1" />

  <!-- ================= TOP HEADER / METADATA STRIP ================= -->
  <g transform="translate(68, 44)">
    <!-- Brand Mark: Precision Optical Aperture -->
    <g transform="translate(0, -2)">
      <!-- Outer Aperture Ring -->
      <circle cx="18" cy="18" r="17" fill="#111622" stroke="#252F42" stroke-width="1.25" />
      <!-- Middle Reticle Ring -->
      <circle cx="18" cy="18" r="10" fill="#0A0D15" stroke="#3E4C63" stroke-width="1" />
      <!-- Central Optical Core -->
      <circle cx="18" cy="18" r="3.5" fill="#FFFFFF" />
      <!-- Emerald Registration Notch at 12 o'clock -->
      <line x1="18" y1="1" x2="18" y2="6" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Wordmark & Classification -->
    <text x="50" y="25" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="28" font-weight="900" fill="url(#metalSheen)" letter-spacing="3.5">
      RECON
    </text>

    <!-- Hairline Divider -->
    <line x1="184" y1="8" x2="184" y2="26" stroke="#252F42" stroke-width="1" />

    <text x="200" y="23" font-family="'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#64748B" letter-spacing="1.5">
      THE INTEGRATION READINESS ENGINE
    </text>

    <!-- Top Right Spec Metadata -->
    <text x="1064" y="23" font-family="'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600" fill="#475569" letter-spacing="1.2" text-anchor="end">
      ZERO-SAMPLING • HUMAN-AUDITED • PURE AST
    </text>
  </g>

  <!-- Hairline Divider Under Header -->
  <line x1="68" y1="84" x2="1132" y2="84" stroke="#161C28" stroke-width="1" />

  <!-- ================= CENTER THESIS & VALUE PROPOSITION ================= -->
  <g transform="translate(68, 138)">
    <!-- Master Headline -->
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="#F8FAFC" letter-spacing="-0.5">
      Know what will break before you build the integration.
    </text>

    <!-- Editorial Explanation -->
    <text x="0" y="36" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#94A3B8">
      A preflight verification engine that catches schema drift, unmapped required fields, and domain violations
    </text>
    <text x="0" y="60" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#94A3B8">
      in incoming partner data batches — before you write or deploy data pipeline code.
    </text>
  </g>

  <!-- Hairline Divider Above Spec Columns -->
  <line x1="68" y1="228" x2="1132" y2="228" stroke="#161C28" stroke-width="1" />

  <!-- ================= BOTTOM 3-COLUMN SPECIFICATION ================= -->
  <g transform="translate(68, 256)">
    
    <!-- Column 1: Profiling -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" font-family="'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1.2">
        01 / 100% COLUMNAR PROFILING
      </text>
      <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#64748B">
        Zero-sampling full batch analysis across CSV, TSV &amp; nested JSON.
      </text>
    </g>

    <!-- Divider 1 -->
    <line x1="365" y1="-8" x2="365" y2="40" stroke="#1A202C" stroke-width="1" />

    <!-- Column 2: Audit -->
    <g transform="translate(395, 0)">
      <text x="0" y="0" font-family="'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#10B981" letter-spacing="1.2">
        02 / HUMAN-IN-THE-LOOP AUDIT
      </text>
      <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#64748B">
        Hard blockers (R001–R009) halt code synthesis until lead sign-off.
      </text>
    </g>

    <!-- Divider 2 -->
    <line x1="745" y1="-8" x2="745" y2="40" stroke="#1A202C" stroke-width="1" />

    <!-- Column 3: AST Adapter Synthesis -->
    <g transform="translate(775, 0)">
      <text x="0" y="0" font-family="'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#818CF8" letter-spacing="1.2">
        03 / PURE PYTHON AST ADAPTERS
      </text>
      <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#64748B">
        Standalone PEP-8 code output with zero data loss guarantee.
      </text>
    </g>

  </g>

</svg>
